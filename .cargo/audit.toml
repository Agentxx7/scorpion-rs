# https://rustsec.org/advisories/
[advisories]
ignore = [
    # Feature-blind Cargo.lock finding: rsa is present through sqlx-mysql,
    # but the V1 spider_cli/spider_mcp graph does not enable sqlx-mysql.
    # release-gate.yml independently rejects rsa 0.9.10 in that exact graph.
    "RUSTSEC-2023-0071",
    # Feature-blind Cargo.lock findings: hickory-proto 0.25.2 is retained
    # only by the excluded wreq compatibility feature. The selected V1 graph
    # uses hickory-proto 0.26.1. release-gate.yml enforces that boundary.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # Feature-blind Cargo.lock finding: lopdf 0.36.0 is retained only by the
    # excluded memvid/full-agent graph. Shipping PDF extraction resolves
    # lopdf 0.42.0. release-gate.yml rejects 0.36.0 in the exact V1 graph.
    "RUSTSEC-2026-0187",
]
