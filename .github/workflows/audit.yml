name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        # RUSTSEC-2026-0187 (lopdf < 0.42 stack overflow, process abort — not
        # a catchable panic). spider_mcp's own pdf-extract dependency (the
        # shipping PDF-extraction path used by both spider-mcp and the
        # default `scorpion` CLI) is upgraded to 0.12, which requires
        # `lopdf ^0.42` — the vulnerable version is NOT in that path.
        #
        # The vulnerable lopdf 0.36.0 remains in Cargo.lock, and cargo-audit
        # is feature-blind, so the repository config narrowly records it:
        # memvid-rs 1.2.0 (the
        # latest release) independently hard-pins `lopdf = "^0.36"` in its
        # own manifest. memvid-rs is pulled in only by spider_agent's
        # `memvid` feature, which is only reachable via spider_agent's own
        # `full` feature (spider's `agent_full` forwards to it) — and
        # `agent_full`/`full`/`memvid` are enabled by NEITHER spider_cli's
        # nor spider_mcp's default features (spider_mcp does not depend on
        # spider_agent at all). No default/shipping build of `scorpion` or
        # `spider-mcp` ever resolves the vulnerable path.
        #
        # release-gate.yml separately fails if this version enters either
        # selected V1 artifact. Remove the config exception once memvid-rs
        # ships a release on lopdf >= 0.42.
        run: cargo audit
