name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tagged source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > notes.md
            echo "" >> notes.md
            git log "$PREV_TAG".."$TAG" --pretty=format:"- %s" --no-merges >> notes.md
          else
            echo "Initial release" > notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
