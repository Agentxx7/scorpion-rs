name: Rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER: ${{ secrets.OPEN_ROUTER }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      RUN_LIVE_TESTS: ${{ secrets.RUN_LIVE_TESTS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Cargo test spider_agent (default)
        run: cargo test -p spider_agent
      - name: Cargo test spider_agent (openai + search_serper)
        run: cargo test -p spider_agent --features "openai search_serper"
      - name: Cargo test spider_agent live smoke
        if: env.RUN_LIVE_TESTS == '1' || env.RUN_LIVE_TESTS == 'true' || env.RUN_LIVE_TESTS == 'TRUE'
        run: cargo test -p spider_agent --features "openai search_serper" --test live_env_smoke -- --nocapture

  chrome:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_TESTS: ${{ secrets.RUN_LIVE_TESTS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-chrome-${{ hashFiles('**/Cargo.lock') }}
      # Stack-frame regression guard. `website::scrape` does not launch
      # chrome (default config uses the HTTP path), so no browser binary
      # is needed — but compiling with `--features chrome` folds the
      # chrome page-fetch frames into the crawl future, and if they
      # regrow unboxed this SIGABRTs on the 2MB stack (the v2.51.188
      # regression). Network-bound (hits choosealicense.com), so gated
      # on RUN_LIVE_TESTS like the spider_agent live smoke step.
      - name: Cargo test spider scrape (chrome frame guard)
        if: env.RUN_LIVE_TESTS == '1' || env.RUN_LIVE_TESTS == 'true' || env.RUN_LIVE_TESTS == 'TRUE'
        run: cargo test -p spider --features chrome website::scrape -- --exact --nocapture

  # SCORPION_CANONICAL_CLOSURE_AND_PRODUCTION_REALITY_HARNESS_001: before
  # this job existed, `spider --lib` (755+ unit tests) and
  # `spider --test architecture_guardrails` (every architecture guardrail
  # built up across this repository's frontier history) never ran in CI at
  # all — only narrow slices (`uring_fs`, one live-gated `website::scrape`
  # smoke test) did. Every closure claim resting on those suites had only
  # ever been verified locally. This job closes that gap, and also runs
  # `closure_harness` — the tool that checks other capabilities' CI_ENFORCED
  # claims — so it cannot itself be an exception to the rule it enforces.
  #
  # Required/deterministic only: every step below must not depend on
  # third-party live-network behavior. The exact, current set of
  # live-network tests is tracked machine-checkably in
  # docs/frontier/ledger/LIVE_NETWORK_TESTS.toml, independently
  # re-derived every run by closure_harness's own static analysis
  # (`live_network_registry_matches_detected_reality`,
  # `required_ci_excludes_every_registered_live_test`) — this comment is
  # documentation, not the source of truth; if the two ever disagree, the
  # `spider_core` job's own second step (which runs closure_harness)
  # fails. `--skip` below excludes the registry entries compiled by these
  # (`crawl`, `scrape`, `crawl_invalid` [covered by the `website::crawl`
  # skip via prefix match], `not_crawl_blacklist`,
  # `not_crawl_blacklist_regex`, `test_crawl_subdomains`,
  # `test_crawl_glob`, `test_crawl_tld`, `test_crawl_subscription`,
  # `test_crawl_proxy`, `test_crawl_budget`, `test_crawl_pause_resume`)
  # feature combinations; the canonical registry currently contains 13 total.
  # `test_crawl_shutdown`
  # (spider.cloud) requires a feature neither step enables and needs no
  # skip here. They still run, unfiltered, in the separately-classified
  # `spider_core_live_network` job below.
  spider_core:
    runs-on: ubuntu-latest
    # Bypass class closed (Codex adversarial review): "proxy state during
    # assurance execution — GitHub Actions run steps are separate
    # processes; an `unset` performed in the firewall/probe step does not
    # guarantee later test steps inherit cleared proxy variables." Each
    # `run:` step below is its own shell process; the firewall step's own
    # `unset HTTP_PROXY ...` (further down) only ever cleared that one
    # step's process environment, not any step that runs after it. A
    # job-level `env:` block is inherited by *every* step's process
    # (unlike a shell `unset`, which dies with the step that ran it), so
    # every step in this job — the pre-build/dependency-fetch steps
    # before lockdown, the firewall step itself, and every assurance-
    # execution step after it — starts with these proxy variables
    # explicitly forced empty, both upper- and lower-case forms. This
    # closes the exact gap named: a proxy variable set by the runner
    # environment (or a prior step, if GitHub Actions semantics ever
    # changed) can no longer route a post-lockdown `cargo test` process
    # through a loopback proxy and regain effective external network
    # access despite the firewall's DROP rule.
    env:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
    steps:
      - uses: actions/checkout@v7
      # SCORPION_CANONICAL_CAPTCHA_CI_ENFORCED_AND_CLOSED_ACTIVATION_001:
      # GitHub Actions' own workflow-file validator rejects a job-level
      # `env:` mapping containing both `HTTP_PROXY` and `http_proxy` (and
      # the https_proxy/all_proxy/no_proxy pairs) as the same key already
      # defined — case-insensitive collision detection at the schema
      # level, unlike the real POSIX shell environment these variables
      # actually populate, where the two casings are genuinely distinct
      # and different tools check either one. Found for real: this exact
      # duplication has sat undetected in this file since before this
      # session, only surfacing now that GitHub Actions execution was
      # re-enabled for this repository — every workflow in this file
      # failed to even parse (zero jobs started, any commit, until this
      # one). The lowercase forms move here, set via `$GITHUB_ENV` (the
      # officially supported mechanism for one step to export env vars to
      # every later step in the same job), preserving the original
      # security property exactly — every step from this point onward
      # still starts with all eight upper/lowercase proxy variables
      # forced empty — without hitting the static schema's duplicate-key
      # check, since a `$GITHUB_ENV` write is not part of the YAML `env:`
      # mapping at all.
      - name: "Clear lowercase proxy env vars for every later step (GitHub's env: schema rejects case-only duplicate keys)"
        run: |
          echo "http_proxy=" >> "$GITHUB_ENV"
          echo "https_proxy=" >> "$GITHUB_ENV"
          echo "all_proxy=" >> "$GITHUB_ENV"
          echo "no_proxy=" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-spidercore-${{ hashFiles('**/Cargo.lock') }}
      # Dependency fetch/build happens with full network access, before
      # egress is denied below — `cargo test --no-run` compiles every
      # binary this job will later execute without running anything, so
      # the deny step that follows applies only to the deterministic test
      # *phase*, not to crates.io/registry access.
      - name: Pre-build deterministic + closure-assurance test binaries (network still open)
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test -p spider --lib --test architecture_guardrails --test closure_harness
          --test closure_harness_integrity --test closure_harness_behavioral_contract
          --features "chrome cache cache_request" --no-run
      - name: Pre-build chrome_remote_cache regression binary (network still open)
        run: cargo test -p spider --lib --features chrome_remote_cache --no-run
      # Runtime egress denial for the deterministic phase — the primary
      # enforcement mechanism, not the static LIVE_NETWORK_TESTS registry
      # alone. GitHub-hosted ubuntu-latest runners grant the runner user
      # passwordless sudo, so this is designed as a real, working rule
      # set, not aspirational — but see the NOTE below on what could and
      # could not be verified.
      #
      # Fixes over the prior version, each closing a specific demonstrated
      # bypass:
      #   - `ip6tables` rules mirror every `iptables` (IPv4) rule — the
      #     prior version left IPv6 completely unrestricted.
      #   - No DNS is permitted at all (the prior version allowed any
      #     external DNS server on port 53, itself a viable exfiltration/
      #     tunneling channel). The deterministic phase's tests are all
      #     either pure in-memory logic or LOCAL_NETWORK (127.0.0.1)
      #     fixtures — none of them legitimately need to resolve a
      #     hostname, so none is allowed to.
      #   - `-F`/`-X` flush every pre-existing OUTPUT rule (both stacks)
      #     before adding any of ours, so no earlier ACCEPT rule — from
      #     the runner image's own default configuration, which this
      #     workflow does not control — can out-rank the REJECT below by
      #     rule-ordering accident. The explicit rule *order* added here
      #     (loopback ACCEPT, then REJECT) is itself now the only source
      #     of truth for this chain.
      #   - `set -euo pipefail` plus checking each `sudo iptables`/
      #     `ip6tables` call's own exit status: if firewall setup itself
      #     fails partway (e.g. the runner image lacks `iptables`, or
      #     sudo is unexpectedly unavailable), the step fails closed —
      #     the job stops here rather than silently proceeding into the
      #     "deterministic" phase with no enforcement at all.
      #   - Explicit post-install probes prove the lockdown is actually
      #     active before any test runs: loopback must still work,
      #     IPv4 external must fail, IPv6 external must fail. Any probe
      #     behaving the wrong way fails the step.
      #
      # NOTE (was unverified, now real, see
      # SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_001):
      # this step's first real execution (run 32880266079, on this exact
      # rule set minus the ESTABLISHED,RELATED accept below) hung
      # indefinitely — the workflow API showed this step permanently
      # `in_progress`, with every job after it never even starting, for
      # 30+ minutes on rules whose own commands are all near-instant and
      # whose own probes are all explicitly bounded (`curl --max-time 3`,
      # `sleep 1`). Root cause (well-reasoned inference, not directly
      # observed — this session's own API access could not read live
      # step logs, 403 "must have admin rights"; GitHub-hosted runner
      # jobs run directly on the VM, not in a nested container, so the
      # Actions runner *agent* process shares this exact host network
      # namespace with the `sudo iptables` commands below): the original
      # rule set had no exception for already-ESTABLISHED connections,
      # so `-P OUTPUT DROP` correctly blocked new external connections
      # but also cut off the runner agent's own already-open outbound
      # connection back to GitHub's own service — the one it needs to
      # report this very step's completion. The script's internal probes
      # likely finished in seconds exactly as designed; GitHub simply
      # never found out, because the agent could no longer tell it
      # anything. Fixed by accepting ESTABLISHED/RELATED traffic first,
      # on both stacks — the standard, well-known idiom for exactly this
      # class of self-inflicted lockout, preserving the intended
      # property exactly (still-open connections survive; genuinely new
      # outbound connections, which is what every later `cargo test`
      # process making a fresh external request would need, remain
      # denied) without weakening it. Every `sudo iptables`/`ip6tables`
      # call below now also has explicit before/after logging and a
      # bounded `timeout`, as defense in depth against the separate,
      # still-possible failure mode of genuine `/run/xtables.lock`
      # contention (this was not what actually happened here, per the
      # reasoning above, but a 10s bound costs nothing and turns that
      # class of hang into a fast, loud failure instead of a silent one).
      - name: Deny external network egress for the deterministic test phase (IPv4 + IPv6, fail-closed, self-verifying)
        run: |
          set -euo pipefail

          run_bounded() {
            echo "BEGIN: $*"
            if ! timeout 10 "$@"; then
              echo "::error::TIMED OUT OR FAILED after 10s: $*"
              exit 1
            fi
            echo "END: $*"
          }

          # Flush first: no rule from the runner image's own default
          # OUTPUT chain configuration survives to compete with ours.
          run_bounded sudo iptables -F OUTPUT
          run_bounded sudo ip6tables -F OUTPUT

          # Established/related first, on both stacks — the GitHub
          # Actions runner agent's own already-open outbound connection
          # to GitHub's service must survive this lockdown, or the agent
          # can never report this step's (or any later step's) result.
          # This does not weaken the property being enforced: the probes
          # below open genuinely *new* connections, which this rule does
          # not match, so "external egress denied" is exactly as strict
          # as before for anything that isn't already an established
          # connection predating this step.
          run_bounded sudo iptables  -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
          run_bounded sudo ip6tables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

          # Loopback only beyond that. No DNS, no external host, on
          # either stack, for any genuinely new connection.
          run_bounded sudo iptables  -A OUTPUT -o lo -j ACCEPT
          run_bounded sudo iptables  -A OUTPUT -d 127.0.0.0/8 -j ACCEPT
          run_bounded sudo iptables  -P OUTPUT DROP
          run_bounded sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          run_bounded sudo ip6tables -A OUTPUT -d ::1/128 -j ACCEPT
          run_bounded sudo ip6tables -P OUTPUT DROP

          # A proxy env var pointed at an allowed (loopback) address could
          # let `curl` route an "external" probe through it and appear to
          # succeed/fail for the wrong reason — unset every case variant
          # before probing, so each probe measures the firewall, not a
          # proxy configuration. This job's own `env:` block (see above)
          # already forces every one of these empty for this step's
          # process (and every other step's, including the assurance
          # steps that follow) — this `unset` is kept as a second,
          # belt-and-suspenders guarantee specifically for this probe's
          # own shell, since an empty-string env var and a genuinely
          # unset one are not always treated identically by every tool.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy

          echo "Probe: IPv4 loopback (must succeed)"
          python3 -m http.server 18734 --bind 127.0.0.1 &>/dev/null &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          sleep 1
          if ! curl -sS --max-time 3 -o /dev/null http://127.0.0.1:18734/; then
            echo "::error::IPv4 loopback connectivity failed — firewall rules are too strict, LOCAL_NETWORK fixtures cannot run"
            exit 1
          fi

          echo "Probe: IPv6 loopback (must succeed)"
          python3 -m http.server 18735 --bind ::1 &>/dev/null &
          server6_pid=$!
          trap "kill $server_pid $server6_pid 2>/dev/null || true" EXIT
          sleep 1
          if ! curl -sS --max-time 3 -g -o /dev/null "http://[::1]:18735/"; then
            echo "::error::IPv6 loopback connectivity failed — firewall rules are too strict, LOCAL_NETWORK fixtures cannot run"
            exit 1
          fi

          echo "Probe: IPv4 external egress (must be denied)"
          if curl -sS --max-time 3 -o /dev/null https://1.1.1.1/ 2>/dev/null; then
            echo "::error::IPv4 external egress succeeded — firewall lockdown is not active"
            exit 1
          fi

          echo "Probe: IPv6 external egress (must be denied)"
          if curl -sS --max-time 3 -6 -o /dev/null https://[2606:4700:4700::1111]/ 2>/dev/null; then
            echo "::error::IPv6 external egress succeeded — firewall lockdown is not active"
            exit 1
          fi

          echo "Firewall lockdown confirmed active (IPv4/IPv6 loopback usable, IPv4/IPv6 external egress denied)."
      - name: Cargo test spider lib, deterministic only (default features)
        run: >-
          cargo test -p spider --lib --
          --skip website::crawl
          --skip website::scrape
          --skip website::not_crawl_blacklist
          --skip website::test_crawl_subdomains
          --skip website::test_crawl_tld
          --skip website::test_crawl_subscription
          --skip website::test_crawl_budget
          --skip website::test_crawl_glob
          --skip website::test_crawl_pause_resume
          --skip website::test_crawl_proxy
          --skip website::test_crawl_shutdown
      # RUST_MIN_STACK: pre-existing, environment-specific stack-overflow
      # under this feature combination at the default thread stack size
      # (confirmed identical on baseline `HEAD` via `git stash`, unrelated
      # to any change in this job) — the full `website::*` suite needs a
      # larger stack to run in-process together under `chrome`.
      - name: Cargo test spider lib, deterministic only (chrome cache cache_request)
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test -p spider --lib
          --features "chrome cache cache_request" --
          --skip website::crawl
          --skip website::scrape
          --skip website::not_crawl_blacklist
          --skip website::test_crawl_subdomains
          --skip website::test_crawl_tld
          --skip website::test_crawl_subscription
          --skip website::test_crawl_budget
          --skip website::test_crawl_glob
          --skip website::test_crawl_pause_resume
          --skip website::test_crawl_proxy
          --skip website::test_crawl_shutdown
      # THE closure/architecture assurance suite — deliberately its own,
      # standalone step, never bundled with `--lib`. This is the narrow,
      # truthful CI_ENFORCED claim this frontier actually makes: "the
      # closure/architecture assurance suite is deterministic and
      # CI-enforced," not "all spider unit tests are deterministic." Its
      # pass/fail signal is now about exactly these four targets, not
      # entangled with ~840 unrelated `--lib` tests (some of which are
      # LOCAL_NETWORK TcpListener fixtures never individually audited for
      # this claim). `closure_harness_behavioral_contract` — the
      # independent, subprocess-based behavioral suite that proves each
      # verifier rule actually rejects a real invalid fixture, not merely
      # that the source text asserting so exists — is included here so it
      # is itself required, non-gated CI, not merely a local development
      # check (Codex adversarial review: "the independent behavioral
      # suite must be in REQUIRED assurance CI").
      - name: Cargo test closure/architecture assurance suite (chrome cache cache_request)
        run: >-
          cargo test -p spider --test architecture_guardrails --test closure_harness
          --test closure_harness_integrity --test closure_harness_behavioral_contract
          --features "chrome cache cache_request"
      # SCORPION_CANONICAL_CAPTCHA_CI_ENFORCEABLE_EVIDENCE_PARTITION_001:
      # the CI-portable slice of the CAPTCHA production chain's own
      # VERIFIED evidence — real headless Chrome (ubuntu-latest ships
      # Chrome/Chromium; `spider::features::chrome::launch_browser`
      # discovers it, no explicit install step needed), real challenge
      # detection/materialization/routing/action across TopLevel,
      # same-session-frame, and OOPIF execution contexts, and the real
      # shipping (`Website::crawl`) OOPIF-visibility/multi-target/
      # cross-request-isolation regression. `local_paligemma` is compiled
      # in (several of these files import `PaligemmaLocalCaptchaProvider`
      # even where a given test injects a deterministic
      # `FixedPointProvider` instead) but never `local_paligemma_cuda` —
      # no CUDA toolchain, no GPU, no `SCORPION_PALIGEMMA_PINNED_
      # ARTIFACTS`, no 13.5GB RAM preflight is required to compile or run
      # any test this command selects. The one test in this file set that
      # genuinely does need real PaliGemma inference
      # (`website_crawl_shipping_pipeline_detects_and_solves_a_genuine_
      # oopif_challenge`) is `#[ignore]`d for exactly that reason — its
      # own real-hardware pass is `OPERATOR_OBSERVED`/`LIVE_ENVIRONMENT_
      # DEPENDENT` evidence in the ledger, not CI-executed evidence.
      - name: Cargo test CAPTCHA CI-portable evidence (chrome local_paligemma)
        run: >-
          cargo test -p spider --test browser_challenge_detection_real
          --test captcha_browser_binding_real --test captcha_browser_frame_action_real
          --test captcha_browser_production_binding_real --test captcha_browser_oopif_action_real
          --test captcha_browser_oopif_streaming_shipping_real --features "chrome local_paligemma"
      - name: Cargo test canonical credential-cache regression (exact features)
        run: cargo test -p spider --lib cache_request --features "chrome cache cache_request"
      # Targeted, exact-match, single-test regression for the
      # legacy/vendor-chromey cache-isolation invariant
      # (SCORPION_CANONICAL_CREDENTIAL_CACHE_ISOLATION_001) — this test
      # requires `chrome_remote_cache` specifically, a different (larger)
      # feature than `chrome cache cache_request` above, and is otherwise
      # uncovered by any step in this job. `--exact` on the one named test
      # avoids compiling this feature combination's full `--lib` suite
      # (which would also pull the same live-network `website::*` tests
      # back in, undoing the determinism above) while still genuinely
      # compiling and running the regression, not merely checking it
      # exists.
      - name: Cargo test spider credential-cache regression (chrome_remote_cache)
        run: >-
          cargo test -p spider --lib --features chrome_remote_cache
          utils::tests::test_cache_enabled_excludes_authorized -- --exact

  # Current shipping-product deterministic proof. These commands exercise
  # durable research and the CLI fixture/reopen contracts; they are not live
  # SearXNG/model acceptance and must never be reported as such.
  current_product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-current-product-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo test spider_agent deterministic research (OpenAI-compatible + SearXNG)
        run: cargo test -p spider_agent --features "openai search_searxng"
      - name: Cargo test spider_agent_html
        run: cargo test -p spider_agent_html
      - name: Cargo test durable canonical acquisition
        run: cargo test -p spider --features "agent_acquisition agent_openai agent_search_searxng disk" features::agent_acquisition::tests
      - name: Cargo test durable ResearchSession and DurableResearchResult
        run: cargo test -p spider --features "agent_acquisition agent_openai agent_search_searxng disk" features::research_session::tests
      - name: Cargo test canonical identity
        run: cargo test -p spider --features serde features::identity::tests
      - name: Cargo check CLI without default features
        run: cargo check -p spider_cli --no-default-features
      - name: Cargo check CLI research feature composition
        run: cargo check -p spider_cli --no-default-features --features research
      - name: Cargo test research-only CLI unit contract
        run: cargo test -p spider_cli --no-default-features --features research --bin scorpion
      - name: Cargo test research-only shipping binary RUN and SHOW fixtures
        run: cargo test -p spider_cli --no-default-features --features research --test research_cli
      - name: Cargo test default shipping CLI
        run: cargo test -p spider_cli --bin scorpion
      - name: Cargo test default shipping binary RUN and SHOW fixtures
        run: cargo test -p spider_cli --test research_cli

  # Separately classified: the same 13 live-network tests skipped above,
  # unfiltered, gated behind `RUN_LIVE_TESTS` like the `chrome` job's
  # comparable test — real coverage is preserved, it is simply not part of
  # the required/deterministic closure path. Not treated as
  # `CI_ENFORCED` configuration proof for any capability's closure ledger
  # unless that capability specifically documents a controlled (non-live)
  # test endpoint.
  spider_core_live_network:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_TESTS: ${{ secrets.RUN_LIVE_TESTS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-spidercore-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo test spider lib live network (website crawl/scrape/blacklist/subdomains/tld/subscription/budget/glob/pause_resume/proxy)
        if: env.RUN_LIVE_TESTS == '1' || env.RUN_LIVE_TESTS == 'true' || env.RUN_LIVE_TESTS == 'TRUE'
        run: |
          set -euo pipefail
          cargo test -p spider --lib website::crawl -- --exact --nocapture
          cargo test -p spider --lib website::scrape -- --exact --nocapture
          cargo test -p spider --lib website::crawl_invalid -- --exact --nocapture
          cargo test -p spider --lib website::not_crawl_blacklist -- --exact --nocapture
          cargo test -p spider --lib website::not_crawl_blacklist_regex -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_subdomains -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_glob -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_tld -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_subscription -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_proxy -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_budget -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_pause_resume -- --exact --nocapture
          cargo test -p spider --lib --features spider_cloud website::test_crawl_shutdown -- --exact --nocapture
      - name: Live-test status when disabled
        if: env.RUN_LIVE_TESTS != '1' && env.RUN_LIVE_TESTS != 'true' && env.RUN_LIVE_TESTS != 'TRUE'
        run: echo "LIVE TESTS = NOT RUN"

  io_uring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-uring-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo check spider with io_uring
        run: cargo check -p spider --features io_uring
      - name: Cargo test spider uring_fs
        run: cargo test -p spider --features io_uring uring_fs
      - name: Cargo test spider (no io_uring fallback)
        run: cargo test -p spider --no-default-features --features basic uring_fs
