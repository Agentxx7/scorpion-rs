name: Rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER: ${{ secrets.OPEN_ROUTER }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      RUN_LIVE_TESTS: ${{ secrets.RUN_LIVE_TESTS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Cargo test spider_agent (default)
        run: cargo test -p spider_agent
      - name: Cargo test spider_agent (openai + search_serper)
        run: cargo test -p spider_agent --features "openai search_serper"
      - name: Cargo test spider_agent live smoke
        if: env.RUN_LIVE_TESTS == '1' || env.RUN_LIVE_TESTS == 'true' || env.RUN_LIVE_TESTS == 'TRUE'
        run: cargo test -p spider_agent --features "openai search_serper" --test live_env_smoke -- --nocapture

  chrome:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_TESTS: ${{ secrets.RUN_LIVE_TESTS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-chrome-${{ hashFiles('**/Cargo.lock') }}
      # Stack-frame regression guard. `website::scrape` does not launch
      # chrome (default config uses the HTTP path), so no browser binary
      # is needed — but compiling with `--features chrome` folds the
      # chrome page-fetch frames into the crawl future, and if they
      # regrow unboxed this SIGABRTs on the 2MB stack (the v2.51.188
      # regression). Network-bound (hits choosealicense.com), so gated
      # on RUN_LIVE_TESTS like the spider_agent live smoke step.
      - name: Cargo test spider scrape (chrome frame guard)
        if: env.RUN_LIVE_TESTS == '1' || env.RUN_LIVE_TESTS == 'true' || env.RUN_LIVE_TESTS == 'TRUE'
        run: cargo test -p spider --features chrome website::scrape -- --exact --nocapture

  # SCORPION_CANONICAL_CLOSURE_AND_PRODUCTION_REALITY_HARNESS_001: before
  # this job existed, `spider --lib` (755+ unit tests) and
  # `spider --test architecture_guardrails` (every architecture guardrail
  # built up across this repository's frontier history) never ran in CI at
  # all — only narrow slices (`uring_fs`, one live-gated `website::scrape`
  # smoke test) did. Every closure claim resting on those suites had only
  # ever been verified locally. This job closes that gap, and also runs
  # `closure_harness` — the tool that checks other capabilities' CI_ENFORCED
  # claims — so it cannot itself be an exception to the rule it enforces.
  #
  # Required/deterministic only: every step below must not depend on
  # third-party live-network behavior. The exact, current set of
  # live-network tests is tracked machine-checkably in
  # docs/frontier/ledger/LIVE_NETWORK_TESTS.toml, independently
  # re-derived every run by closure_harness's own static analysis
  # (`live_network_registry_matches_detected_reality`,
  # `required_ci_excludes_every_registered_live_test`) — this comment is
  # documentation, not the source of truth; if the two ever disagree, the
  # `spider_core` job's own second step (which runs closure_harness)
  # fails. `--skip` below excludes the registry entries compiled by these
  # (`crawl`, `scrape`, `crawl_invalid` [covered by the `website::crawl`
  # skip via prefix match], `not_crawl_blacklist`,
  # `not_crawl_blacklist_regex`, `test_crawl_subdomains`,
  # `test_crawl_glob`, `test_crawl_tld`, `test_crawl_subscription`,
  # `test_crawl_proxy`, `test_crawl_budget`, `test_crawl_pause_resume`)
  # feature combinations; the canonical registry currently contains 16
  # total — 3 more (`website::test_respect_robots_txt`,
  # `page::test_host_resolves_locally_cached_does_not_cache_timed_out`,
  # `page::test_host_resolves_locally_cached_second_call_hits_cache`,
  # the latter two covered by the `page::test_host_resolves_locally_
  # cached` skip via prefix match) than when this comment last said 13 —
  # found for real by the first genuinely successful namespace-isolated
  # execution of this exact step (SCORPION_CANONICAL_CI_DETERMINISTIC_
  # NETWORK_LOCKDOWN_EXECUTION_001); neither uses `.crawl()`/`.scrape()`/
  # `.crawl_smart()`, so the static detector itself needed extending
  # too, not just this registry (see `live_network_hosts_in`'s doc
  # comment in closure_harness.rs). They still run, unfiltered, in the
  # separately-classified `spider_core_live_network` job below.
  spider_core:
    runs-on: ubuntu-latest
    # Bypass class closed (Codex adversarial review): "proxy state during
    # assurance execution — GitHub Actions run steps are separate
    # processes; an `unset` performed in one step does not guarantee
    # later test steps inherit cleared proxy variables." Each `run:` step
    # below is its own shell process, so a plain `unset` in one step's
    # script dies with that step. A job-level `env:` block, by contrast,
    # is inherited by *every* step's process, so every step in this job —
    # the pre-build/dependency-fetch steps before isolation, the
    # namespace-setup step itself, and every assurance-execution step
    # after it — starts with these proxy variables explicitly forced
    # empty, both upper- and lower-case forms. This closes the exact gap
    # named: a proxy variable set by the runner environment (or a prior
    # step, if GitHub Actions semantics ever changed) can no longer route
    # a namespace-isolated `cargo test` process through a loopback proxy
    # and regain effective external network access despite the namespace
    # having no route out.
    env:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
    steps:
      # SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_001
      # (CONTINUE: remote step-10 closure-assurance failure) — real root
      # cause, proven both by a real remote panic and a genuine local
      # `git clone --depth 1 --no-local` reproduction of the exact same
      # failure: `actions/checkout@v7` defaults to a *shallow* clone
      # (`fetch-depth: 1`, one commit only). closure_harness.rs's own
      # `git_object_type`/`git_commit_reachable_from_head` (and every
      # ledger check built on them — ADVERSARIALLY_VERIFIED.reviewed_
      # commit, CLOSED.closed_commit, CODE_PROVEN/CI_PROVEN commit
      # fields, and closure_harness_behavioral_contract.rs's own fixture
      # commits, e.g. VALID_BASE's CODE_PROVEN commit) call real `git
      # cat-file -t <sha>`/`git merge-base --is-ancestor <sha> HEAD`
      # against the checked-out repository for *any* commit SHA a ledger
      # or fixture cites — the overwhelming majority of which are
      # ancestors of HEAD, not HEAD itself. Under a depth-1 shallow
      # clone, only the current HEAD commit object exists on disk at
      # all; every one of those `git cat-file`/`merge-base` calls for an
      # older commit genuinely fails with "fatal: could not get object
      # info" / "fatal: Not a valid commit name" — reproduced verbatim,
      # exit 128 both ways, against a real `--depth 1` clone of this
      # exact repository. This was never about root/namespace execution
      # identity (H1, directly rejected earlier this round: the exact
      # same three git subcommands all succeed, exit 0, under the true
      # root+namespace identity when targeting `HEAD`, which a shallow
      # clone always has) — it is a real, environment-level gap
      # (`fetch-depth: 0` is the standard, well-known fix for any CI job
      # that needs to reason about git history rather than only the tip
      # commit) that had simply never been exercised by a real, complete
      # remote run reaching this suite before: this frontier's own
      # parent (SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_
      # EXECUTION_001) is precisely the fix that first let a real run
      # reach step 10 at all. A larger *fixed* depth (e.g. 100) was
      # deliberately rejected as a magic-number non-fix: any ledger
      # commit reference older than that number would silently break
      # again, and this repository's own re-attestation history already
      # produces many such commits over time. Scoped to this job only —
      # `architecture_guardrails`/`closure_harness`/`closure_harness_
      # integrity`/`closure_harness_behavioral_contract` run exclusively
      # here, not in any other job in this workflow.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # SCORPION_CANONICAL_CAPTCHA_CI_ENFORCED_AND_CLOSED_ACTIVATION_001:
      # GitHub Actions' own workflow-file validator rejects a job-level
      # `env:` mapping containing both `HTTP_PROXY` and `http_proxy` (and
      # the https_proxy/all_proxy/no_proxy pairs) as the same key already
      # defined — case-insensitive collision detection at the schema
      # level, unlike the real POSIX shell environment these variables
      # actually populate, where the two casings are genuinely distinct
      # and different tools check either one. Found for real: this exact
      # duplication has sat undetected in this file since before this
      # session, only surfacing now that GitHub Actions execution was
      # re-enabled for this repository — every workflow in this file
      # failed to even parse (zero jobs started, any commit, until this
      # one). The lowercase forms move here, set via `$GITHUB_ENV` (the
      # officially supported mechanism for one step to export env vars to
      # every later step in the same job), preserving the original
      # security property exactly — every step from this point onward
      # still starts with all eight upper/lowercase proxy variables
      # forced empty — without hitting the static schema's duplicate-key
      # check, since a `$GITHUB_ENV` write is not part of the YAML `env:`
      # mapping at all.
      - name: "Clear lowercase proxy env vars for every later step (GitHub's env: schema rejects case-only duplicate keys)"
        run: |
          echo "http_proxy=" >> "$GITHUB_ENV"
          echo "https_proxy=" >> "$GITHUB_ENV"
          echo "all_proxy=" >> "$GITHUB_ENV"
          echo "no_proxy=" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-spidercore-${{ hashFiles('**/Cargo.lock') }}
      # Dependency fetch/build happens with full network access, before
      # egress is denied below — `cargo test --no-run` compiles every
      # binary this job will later execute without running anything, so
      # the deny step that follows applies only to the deterministic test
      # *phase*, not to crates.io/registry access.
      - name: Pre-build deterministic + closure-assurance test binaries (network still open)
        env:
          RUST_MIN_STACK: "67108864"
        run: >-
          cargo test -p spider --lib --test architecture_guardrails --test closure_harness
          --test closure_harness_integrity --test closure_harness_behavioral_contract
          --features "chrome cache cache_request" --no-run
      - name: Pre-build chrome_remote_cache regression binary (network still open)
        run: cargo test -p spider --lib --features chrome_remote_cache --no-run
      # SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_001
      # (CONTINUE: remote step-10 closure-assurance failure — now step
      # 11, CAPTCHA CI-portable evidence). Real root cause, proven via a
      # temporary remote diagnostic (since removed): the two pre-build
      # steps above compile every binary for `chrome cache cache_request`
      # and `chrome_remote_cache` — but the CAPTCHA CI-portable evidence
      # step below compiles a *third*, distinct feature combination,
      # `chrome local_paligemma`, which was never pre-built here at all.
      # Once step 10's own unrelated blocker (shallow-clone commit
      # reachability, fixed above) was resolved and step 11 became
      # reachable on real CI for the first time ever, its own `cargo
      # test` invocation — running *after* network isolation below —
      # had to fetch `local_paligemma`-only dependencies (monostate,
      # float8, gemm-c32, onig, and others) fresh, and failed outright:
      # "Could not resolve hostname (Could not resolve host: static.
      # crates.io)". This directly contradicts this file's own stated
      # intent for the pre-build phase (see the comment above: "compiles
      # every binary this job will later execute without running
      # anything") — the CAPTCHA binaries were simply missing from it,
      # not a case for weakening isolation or opening egress back up.
      # Mirrors the two pre-build steps above exactly: same six test
      # targets and feature set as the canonical step 11 command below,
      # `--no-run`, network still open.
      - name: Pre-build CAPTCHA CI-portable evidence binaries (network still open)
        run: >-
          cargo test -p spider --test browser_challenge_detection_real
          --test captcha_browser_binding_real --test captcha_browser_frame_action_real
          --test captcha_browser_production_binding_real --test captcha_browser_oopif_action_real
          --test captcha_browser_oopif_streaming_shipping_real --features "chrome local_paligemma" --no-run
      # Runtime egress denial for the deterministic phase — the primary
      # enforcement mechanism, not the static LIVE_NETWORK_TESTS registry
      # alone. GitHub-hosted ubuntu-latest runners grant the runner user
      # passwordless sudo and ship `iproute2` (the `ip` command,
      # including `ip netns`) standard on the image, so this is designed
      # as a real, working mechanism, not aspirational.
      #
      # History (SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_
      # EXECUTION_001): an earlier, host-global-iptables version of this
      # step failed twice in sequence, both times for the same underlying
      # design reason:
      #   1. First real execution (run 32880266079): `-P OUTPUT DROP`
      #      with no ESTABLISHED,RELATED exception cut off the GitHub
      #      Actions runner agent's own already-open connection back to
      #      GitHub the instant the policy took effect, so the agent
      #      could never report this step's (or any later step's)
      #      result — the step showed permanently `in_progress` for
      #      30+ minutes although its own commands are all near-instant.
      #      Fixed by accepting ESTABLISHED,RELATED traffic first.
      #   2. That fix made this step itself succeed, but the very next
      #      step (a `cargo test` invocation, long enough for GitHub's
      #      own infrastructure to recycle the runner's one preserved
      #      connection) hung the same way: run 32884308840's job was
      #      force-completed by GitHub itself as a failure ~60 minutes
      #      after that step started, its own step record frozen
      #      mid-flight with no `completed_at` ever recorded. GitHub's
      #      own annotation on that run named the mechanism directly:
      #      "The hosted runner lost communication with the server...
      #      blocks its network access can cause this error." A repeat
      #      run (32889345557), with that step wrapped in a local,
      #      network-independent `timeout 600`, still showed it frozen
      #      `in_progress` more than ten minutes past that bound —
      #      evidence the *test process* was not what was stuck (a local
      #      `timeout` needs no network to fire); the runner's own
      #      reporting channel was.
      #
      # Root cause: a host-global iptables policy does not merely
      # constrain the test processes — GitHub-hosted runner jobs execute
      # every step directly on the host VM, not inside a nested
      # per-step container, so the Actions runner *agent* process shares
      # this exact network namespace with any `sudo iptables` command a
      # step runs. An ESTABLISHED,RELATED exception only preserves the
      # one connection already open at rule-install time; it cannot let
      # the agent open a *new* one later, which GitHub's own
      # infrastructure evidently requires it to do periodically.
      #
      # Fix: stop sharing the isolation boundary instead of continuing
      # to patch exceptions into a shared one. This step creates a
      # dedicated network namespace (`ip netns`); only the six
      # `cargo test` invocations below run inside it, via
      # `sudo ip netns exec spider_ci env PATH=<literal> HOME=<literal>
      # CARGO_HOME=<literal> RUSTUP_HOME=<literal> ...` (the
      # explicit `env PATH=<literal>` is required, not cosmetic — see
      # the probe further down this same step for why: plain `sudo`
      # resets PATH to its own `secure_path` sudoers policy, and — real
      # remote finding, not merely documented behavior — `secure_path`
      # overrides even `sudo --preserve-env=PATH`, which was tried
      # first and observed to fail identically; only explicitly setting
      # PATH on the exec'd child via `env`, after sudo has already
      # elevated, actually works around it). The runner agent process
      # itself is never placed in this namespace and keeps its normal,
      # completely unrestricted host networking throughout — the class
      # of defect above is now structurally impossible for this
      # mechanism to reproduce, not merely made less likely. A namespace
      # with no interface beyond loopback also has no route to anywhere
      # else, so a test that accidentally reaches for external network
      # fails immediately (ENETUNREACH) instead of hanging on a silent
      # iptables DROP — a second, independent improvement.
      #
      # Accepted trade-off, stated plainly rather than hidden: commands
      # run via `sudo ip netns exec` execute as root (entering a
      # namespace requires CAP_SYS_ADMIN). This is not a new privilege
      # boundary crossed by this design — the runner user already has
      # unrestricted passwordless root via `sudo` on this platform, the
      # same root the prior iptables version already exercised — but it
      # does mean the deterministic test phase itself now also runs as
      # root, not as the normal unprivileged runner user. No test in this
      # phase is known to depend on running unprivileged; if one is ever
      # found to, that is a new, narrow, separately classifiable finding,
      # not a reason this fix was wrong to make.
      #
      #   - `set -euo pipefail` plus checking each command's own exit
      #     status: if namespace setup itself fails (e.g. the runner
      #     image lacks `iproute2`, or sudo is unexpectedly unavailable),
      #     the step fails closed — the job stops here rather than
      #     silently proceeding into the "deterministic" phase with no
      #     enforcement at all.
      #   - Explicit post-setup probes, run *inside* the namespace, prove
      #     the isolation is actually active before any test runs:
      #     loopback must still work, IPv4 external must fail, IPv6
      #     external must fail — and a fourth probe, run *outside* the
      #     namespace (the runner agent's own normal path), proves host
      #     networking is unaffected, the specific property whose
      #     absence caused both prior failures. Any probe behaving the
      #     wrong way fails the step.
      #   - Every command has explicit before/after logging and a
      #     bounded `timeout`, defense in depth against any command
      #     hanging for an unrelated reason.
      - name: Create an isolated network namespace for the deterministic test phase (IPv4 + IPv6, fail-closed, self-verifying, runner-agent-external)
        run: |
          set -euo pipefail

          run_bounded() {
            echo "BEGIN: $*"
            local output
            if ! output=$(timeout 10 "$@" 2>&1); then
              echo "::error::TIMED OUT OR FAILED after 10s: $*"
              # Raw job logs require admin auth this session does not
              # have; captured combined stdout+stderr, echoed one
              # ::error:: line per output line, is visible via the
              # public check-runs annotations API regardless — turns
              # "it failed" into "here is what it actually said."
              while IFS= read -r line; do
                echo "::error::  output: ${line}"
              done <<< "${output}"
              exit 1
            fi
            echo "END: $*"
          }

          # A leftover namespace from a prior attempt on the same runner
          # would make `ip netns add` fail; deleting it first (ignoring
          # "does not exist") keeps this step idempotent without ever
          # silently reusing a namespace whose state this step didn't
          # itself just create.
          sudo ip netns delete spider_ci 2>/dev/null || true

          run_bounded sudo ip netns add spider_ci
          # Loopback inside a fresh namespace starts administratively
          # down — this is the *only* interface that will ever exist in
          # this namespace; no veth, no bridge, no route to the host or
          # the internet is ever created, on either IP stack, so there is
          # no external egress path to firewall in the first place.
          run_bounded sudo ip netns exec spider_ci ip link set lo up

          echo "Probe: loopback inside the namespace (must succeed)"
          sudo ip netns exec spider_ci python3 -m http.server 18734 --bind 127.0.0.1 &>/dev/null &
          server_pid=$!
          trap "sudo kill $server_pid 2>/dev/null || true" EXIT
          sleep 1
          if ! sudo ip netns exec spider_ci curl -sS --max-time 3 -o /dev/null http://127.0.0.1:18734/; then
            echo "::error::IPv4 loopback connectivity failed inside the namespace — LOCAL_NETWORK fixtures cannot run"
            exit 1
          fi

          echo "Probe: IPv4 external egress from inside the namespace (must be denied)"
          if sudo ip netns exec spider_ci curl -sS --max-time 3 -o /dev/null https://1.1.1.1/ 2>/dev/null; then
            echo "::error::IPv4 external egress succeeded from inside the namespace — isolation is not active"
            exit 1
          fi

          echo "Probe: IPv6 external egress from inside the namespace (must be denied)"
          if sudo ip netns exec spider_ci curl -sS --max-time 3 -6 -o /dev/null https://[2606:4700:4700::1111]/ 2>/dev/null; then
            echo "::error::IPv6 external egress succeeded from inside the namespace — isolation is not active"
            exit 1
          fi

          echo "Probe: the runner agent's own (unrestricted, outside-the-namespace) connectivity is unaffected"
          if ! curl -sS --max-time 5 -o /dev/null https://api.github.com/; then
            echo "::error::the host's own network broke as a side effect of namespace setup — this must never happen"
            exit 1
          fi

          # Diagnostic only, always emitted (::notice:: is visible via
          # the GitHub API/UI regardless of whether this step ultimately
          # passes or fails) — the real absolute path to `cargo` for
          # this runner's own normal (non-sudo) user, so a wrong
          # assumption about it below is fast to spot and fix rather
          # than opaque.
          echo "::notice::cargo resolves for the normal runner user (no sudo, no namespace) at: $(command -v cargo). PATH here: $PATH"

          # SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_
          # EXECUTION_001: `sudo` resets the environment — including
          # PATH — to its own `secure_path` sudoers policy by default,
          # which does not include this runner's rustup-managed
          # `~/.cargo/bin`. First attempted with `sudo --preserve-env=
          # PATH`, which was *observed to fail identically* on a real
          # remote run (cargo still did not resolve) — `secure_path`,
          # per sudo's own documented behavior, overrides even an
          # explicit `--preserve-env=PATH`, so that flag cannot win this
          # fight at all. The mechanism that actually works: explicitly
          # setting PATH on the exec'd child via `env`, *after* sudo has
          # already elevated privileges — `env`'s own job is to
          # construct a fresh environment for what it execs next, which
          # is not something `secure_path` (a sudo-specific policy that
          # only governs sudo's own command lookup and the environment
          # sudo itself hands its immediate child) has any say over.
          # `/home/runner` is this runner's standard home directory; the
          # rest of the literal PATH value is the same set `secure_path`
          # itself would supply by default, so `cc`/`ld`/etc. remain
          # resolvable for anything `cargo`/`rustc` needs to invoke
          # during a real compile, not only `cargo` itself. A *literal*
          # value, not `$PATH` shell-expansion, deliberately: this exact
          # string must also appear, unmodified, in every downstream
          # `cargo test` step's `run:` value, two of which
          # (closure_harness.rs's own CI_ENFORCED grammar) forbid any
          # shell metacharacter — including `$` — from appearing at all.
          #
          # HOME/CARGO_HOME/RUSTUP_HOME (SCORPION_CANONICAL_CI_
          # DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_001, second real
          # remote finding on top of the PATH one above): `sudo` also
          # resets HOME to `/root` by default, along with PATH — proven
          # for real, by remote observation, when a PATH-only env fix
          # (this runner's real cargo path confirmed correct via the
          # ::notice:: probe above) still failed to make `cargo
          # --version` succeed as root inside the namespace. `cargo`/
          # `rustup` resolve their own installed-toolchain state under
          # `$HOME/.cargo`/`$HOME/.rustup` (defaulting from `$HOME` when
          # `CARGO_HOME`/`RUSTUP_HOME` aren't set) — with `HOME=/root`,
          # root has no rustup-installed toolchain at all, a plausible,
          # well-evidenced explanation for a fast, non-hanging failure
          # even once `cargo` itself is genuinely reachable via PATH.
          # Set explicitly, same literal-value discipline as PATH, for
          # the same reason (steps 10/11's CI_ENFORCED grammar forbids
          # `$` shell expansion).
          #
          # Proven here, fast and explicitly, rather than discovered
          # only via a downstream step's opaque failure: `cargo` must
          # actually resolve AND run correctly inside the namespace, as
          # root, with this exact mechanism, before any real test step
          # runs. `run_bounded`'s own failure path now also echoes the
          # wrapped command's captured combined stdout+stderr as
          # `::error::` lines, so if this probe fails again, the actual
          # underlying error text is visible via the same public
          # annotations API used throughout this investigation — raw job
          # logs remain inaccessible (403, admin rights required) this
          # session.
          echo "Probe: cargo resolves and runs inside the namespace as root via env PATH=/HOME=/CARGO_HOME=/RUSTUP_HOME=<literal>"
          if ! run_bounded sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup cargo --version; then
            echo "::error::cargo did not resolve/run inside the namespace via sudo ip netns exec env PATH=/HOME=/CARGO_HOME=/RUSTUP_HOME=<literal> — every downstream cargo test step in this job would fail the same way. Check the output lines above (now captured from the failing command itself) and the ::notice:: further above for this runner's actual cargo path if /home/runner was wrong."
            exit 1
          fi

          echo "Network namespace isolation confirmed active (loopback usable inside spider_ci, IPv4/IPv6 external egress denied inside spider_ci, host/runner-agent networking outside the namespace unaffected, cargo resolves inside it)."
      # Each of the six `cargo test` invocations below runs as
      # `sudo ip netns exec spider_ci env PATH=<literal> HOME=<literal>
      # CARGO_HOME=<literal> RUSTUP_HOME=<literal> cargo test ...` (see
      # the namespace setup step above for why the literal values, not
      # sudo flags or shell expansion). The two steps whose exact
      # `run:` text is required, CI_ENFORCED evidence (the closure/architecture
      # assurance suite, and the CAPTCHA CI-portable evidence step) keep
      # that bare, unwrapped form; the other four also add BEGIN/END
      # logging plus a bounded `timeout 600`, defense in depth against
      # any test genuinely hanging for an unrelated reason now that a
      # real, working isolation mechanism is finally in place to test
      # against.
      # Deliberately no `#` comments *inside* any of the four wrapped
      # `run: |` bodies below (this one and the three that follow) —
      # `shell_text_is_unambiguous` (closure_harness.rs) rejects any
      # run: value containing an unquoted `#` at all, precisely so a
      # `--skip` flag can never sit hidden after one where a naive text
      # scan would still "see" it; real regression hit while building
      # this exact step, when an explanatory comment placed *inside* the
      # run: body made this step (and the other three) silently
      # invisible to `required_ci_excludes_every_registered_live_test`'s
      # own step-relevance scan. Output capture (to surface the actual
      # failing test/error text via `::error::` annotations on failure,
      # the way the namespace-setup step's own `run_bounded` already
      # does) was also attempted here and reverted: every diagnostic
      # wrapper construct tried (`case`/`in`, `while`/`do`, `grep -E`)
      # introduced either a rejected dash-flag token or a short bare
      # word that turned out to be an accidental substring of a
      # registered live-network test name (`in` inside
      # `website::crawl_invalid`, `do` inside
      # `website::test_crawl_subdomains`), each silently corrupting
      # `required_ci_excludes_every_registered_live_test`'s own
      # positional-filter parsing. Simpler and safer to keep these four
      # steps at a plain pass/fail signal.
      - name: Cargo test spider lib, deterministic only (default features)
        run: |
          echo "BEGIN: spider lib, default features"
          if ! timeout 600 sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup cargo test -p spider --lib -- \
            --skip website::crawl \
            --skip website::scrape \
            --skip website::not_crawl_blacklist \
            --skip website::test_crawl_subdomains \
            --skip website::test_crawl_tld \
            --skip website::test_crawl_subscription \
            --skip website::test_crawl_budget \
            --skip website::test_crawl_glob \
            --skip website::test_crawl_pause_resume \
            --skip website::test_crawl_proxy \
            --skip website::test_crawl_shutdown \
            --skip website::test_respect_robots_txt \
            --skip page::test_host_resolves_locally_cached > /tmp/step8.log 2>&1; then
            bash .github/scripts/report-test-step-failure.sh /tmp/step8.log "spider lib, default features"
            exit 1
          fi
          echo "END: spider lib, default features"
      # RUST_MIN_STACK: pre-existing, environment-specific stack-overflow
      # under this feature combination at the default thread stack size
      # (confirmed identical on baseline `HEAD` via `git stash`, unrelated
      # to any change in this job) — the full `website::*` suite needs a
      # larger stack to run in-process together under `chrome`.
      # RUST_MIN_STACK is passed explicitly to `env` here, not via this
      # step's own `env:` block: `sudo` resets the environment by default
      # and does not propagate arbitrary variables across that boundary,
      # so a job/step-level `env:` value would silently never reach the
      # namespace-isolated process. `env VAR=value cmd` is the standard,
      # sudoers-policy-independent way to guarantee a variable reaches a
      # specific child process regardless of what gets reset in between.
      - name: Cargo test spider lib, deterministic only (chrome cache cache_request)
        run: |
          echo "BEGIN: spider lib, chrome cache cache_request"
          if ! timeout 600 sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup RUST_MIN_STACK=67108864 cargo test -p spider --lib \
            --features "chrome cache cache_request" -- \
            --skip website::crawl \
            --skip website::scrape \
            --skip website::not_crawl_blacklist \
            --skip website::test_crawl_subdomains \
            --skip website::test_crawl_tld \
            --skip website::test_crawl_subscription \
            --skip website::test_crawl_budget \
            --skip website::test_crawl_glob \
            --skip website::test_crawl_pause_resume \
            --skip website::test_crawl_proxy \
            --skip website::test_crawl_shutdown \
            --skip website::test_respect_robots_txt \
            --skip page::test_host_resolves_locally_cached > /tmp/step9.log 2>&1; then
            bash .github/scripts/report-test-step-failure.sh /tmp/step9.log "spider lib, chrome cache cache_request"
            exit 1
          fi
          echo "END: spider lib, chrome cache cache_request"
      # THE closure/architecture assurance suite — deliberately its own,
      # standalone step, never bundled with `--lib`. This is the narrow,
      # truthful CI_ENFORCED claim this frontier actually makes: "the
      # closure/architecture assurance suite is deterministic and
      # CI-enforced," not "all spider unit tests are deterministic." Its
      # pass/fail signal is now about exactly these four targets, not
      # entangled with ~840 unrelated `--lib` tests (some of which are
      # LOCAL_NETWORK TcpListener fixtures never individually audited for
      # this claim). `closure_harness_behavioral_contract` — the
      # independent, subprocess-based behavioral suite that proves each
      # verifier rule actually rejects a real invalid fixture, not merely
      # that the source text asserting so exists — is included here so it
      # is itself required, non-gated CI, not merely a local development
      # check (Codex adversarial review: "the independent behavioral
      # suite must be in REQUIRED assurance CI").
      # Deliberately not wrapped in `timeout`/`if`/echo like the steps
      # around it: this repository's own closure_harness.rs requires the
      # `--test closure_harness` etc. flags to appear as a real, direct,
      # unambiguous `cargo test` invocation
      # (`closure_harness_itself_is_a_real_required_test_flag_in_ci`,
      # confirmed locally — wrapping this exact step in `echo`/`if`/`fi`
      # broke that check: "a non-executing wrapper (`echo ...`) does not
      # count"). It *is* prefixed with `sudo ip netns exec spider_ci env PATH=<literal> HOME=<literal> CARGO_HOME=<literal> RUSTUP_HOME=<literal>`
      # (SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_
      # 001's namespace-isolation redesign) — `executable_test_command`/
      # `parse_test_selection` in closure_harness.rs were extended,
      # generically and capability-ID-independently, to recognize this
      # one fixed, enumerable isolation-wrapper form as equally
      # "genuinely executable," the same way they already recognized a
      # bare `cargo test ...` — anything else (echo, if/then/fi, timeout,
      # or any other prefix shape) remains rejected exactly as before.
      # The same requirement will apply to whichever step this CAPTCHA
      # capability's own future `[stages.CI_ENFORCED]` entry cites, so
      # this step (and the CAPTCHA one below) must keep exactly this
      # form.
      - name: Cargo test closure/architecture assurance suite (chrome cache cache_request)
        run: >-
          sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup cargo test -p spider --test architecture_guardrails --test closure_harness
          --test closure_harness_integrity --test closure_harness_behavioral_contract
          --features "chrome cache cache_request"
      # SCORPION_CANONICAL_CAPTCHA_CI_ENFORCEABLE_EVIDENCE_PARTITION_001:
      # the CI-portable slice of the CAPTCHA production chain's own
      # VERIFIED evidence — real headless Chrome (ubuntu-latest ships
      # Chrome/Chromium; `spider::features::chrome::launch_browser`
      # discovers it, no explicit install step needed), real challenge
      # detection/materialization/routing/action across TopLevel,
      # same-session-frame, and OOPIF execution contexts, and the real
      # shipping (`Website::crawl`) OOPIF-visibility/multi-target/
      # cross-request-isolation regression. `local_paligemma` is compiled
      # in (several of these files import `PaligemmaLocalCaptchaProvider`
      # even where a given test injects a deterministic
      # `FixedPointProvider` instead) but never `local_paligemma_cuda` —
      # no CUDA toolchain, no GPU, no `SCORPION_PALIGEMMA_PINNED_
      # ARTIFACTS`, no 13.5GB RAM preflight is required to compile or run
      # any test this command selects. The one test in this file set that
      # genuinely does need real PaliGemma inference
      # (`website_crawl_shipping_pipeline_detects_and_solves_a_genuine_
      # oopif_challenge`) is `#[ignore]`d for exactly that reason — its
      # own real-hardware pass is `OPERATOR_OBSERVED`/`LIVE_ENVIRONMENT_
      # DEPENDENT` evidence in the ledger, not CI-executed evidence.
      # Same rationale as the assurance-suite step above: this is the
      # exact step SCORPION_CANONICAL_CAPTCHA_MACHINE_READABLE_
      # CAPABILITY_COVERAGE_001's own future `[stages.CI_ENFORCED]` entry
      # is expected to cite, so it keeps the one recognized isolation
      # prefix (`sudo ip netns exec spider_ci env PATH=<literal> HOME=<literal> CARGO_HOME=<literal> RUSTUP_HOME=<literal>`) and no other shell
      # wrapper.
      # SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_001
      # (CONTINUE: remote step-10 closure-assurance failure — now step
      # 11). RUST_MIN_STACK=67108864, same literal value and same
      # rationale already used on the "chrome cache cache_request" step
      # above (pre-existing, environment-specific stack overflow at the
      # default thread stack size under a `chrome`-enabled feature
      # combination) — proven necessary here too via a temporary remote
      # diagnostic (since removed): captcha_browser_oopif_streaming_
      # shipping_real genuinely aborts with "fatal runtime error: stack
      # overflow" without it, and passes cleanly with it, both confirmed
      # on real remote CI; every other one of this step's six test
      # targets already passed both ways, so this is not a blind
      # bigger-magic-number guess — it is the one binary that actually
      # needed it, given the one value this workflow already established
      # is sufficient for this exact stack-overflow class.
      - name: Cargo test CAPTCHA CI-portable evidence (chrome local_paligemma)
        run: >-
          sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup RUST_MIN_STACK=67108864 cargo test -p spider --test browser_challenge_detection_real
          --test captcha_browser_binding_real --test captcha_browser_frame_action_real
          --test captcha_browser_production_binding_real --test captcha_browser_oopif_action_real
          --test captcha_browser_oopif_streaming_shipping_real --features "chrome local_paligemma"
      - name: Cargo test canonical credential-cache regression (exact features)
        run: |
          echo "BEGIN: canonical credential-cache regression"
          if ! timeout 600 sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup cargo test -p spider --lib cache_request --features "chrome cache cache_request" > /tmp/step12.log 2>&1; then
            bash .github/scripts/report-test-step-failure.sh /tmp/step12.log "canonical credential-cache regression"
            exit 1
          fi
          echo "END: canonical credential-cache regression"
      # Targeted, exact-match, single-test regression for the
      # legacy/vendor-chromey cache-isolation invariant
      # (SCORPION_CANONICAL_CREDENTIAL_CACHE_ISOLATION_001) — this test
      # requires `chrome_remote_cache` specifically, a different (larger)
      # feature than `chrome cache cache_request` above, and is otherwise
      # uncovered by any step in this job. `--exact` on the one named test
      # avoids compiling this feature combination's full `--lib` suite
      # (which would also pull the same live-network `website::*` tests
      # back in, undoing the determinism above) while still genuinely
      # compiling and running the regression, not merely checking it
      # exists.
      - name: Cargo test spider credential-cache regression (chrome_remote_cache)
        run: |
          echo "BEGIN: spider credential-cache regression (chrome_remote_cache)"
          if ! timeout 600 sudo ip netns exec spider_ci env PATH=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner CARGO_HOME=/home/runner/.cargo RUSTUP_HOME=/home/runner/.rustup cargo test -p spider --lib --features chrome_remote_cache \
            utils::tests::test_cache_enabled_excludes_authorized -- --exact > /tmp/step13.log 2>&1; then
            bash .github/scripts/report-test-step-failure.sh /tmp/step13.log "spider credential-cache regression (chrome_remote_cache)"
            exit 1
          fi
          echo "END: spider credential-cache regression (chrome_remote_cache)"

  # Current shipping-product deterministic proof. These commands exercise
  # durable research and the CLI fixture/reopen contracts; they are not live
  # SearXNG/model acceptance and must never be reported as such.
  current_product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-current-product-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo test spider_agent deterministic research (OpenAI-compatible + SearXNG)
        run: cargo test -p spider_agent --features "openai search_searxng"
      - name: Cargo test spider_agent_html
        run: cargo test -p spider_agent_html
      - name: Cargo test durable canonical acquisition
        run: cargo test -p spider --features "agent_acquisition agent_openai agent_search_searxng disk" features::agent_acquisition::tests
      - name: Cargo test durable ResearchSession and DurableResearchResult
        run: cargo test -p spider --features "agent_acquisition agent_openai agent_search_searxng disk" features::research_session::tests
      - name: Cargo test canonical identity
        run: cargo test -p spider --features serde features::identity::tests
      - name: Cargo check CLI without default features
        run: cargo check -p spider_cli --no-default-features
      - name: Cargo check CLI research feature composition
        run: cargo check -p spider_cli --no-default-features --features research
      - name: Cargo test research-only CLI unit contract
        run: cargo test -p spider_cli --no-default-features --features research --bin scorpion
      - name: Cargo test research-only shipping binary RUN and SHOW fixtures
        run: cargo test -p spider_cli --no-default-features --features research --test research_cli
      - name: Cargo test default shipping CLI
        run: cargo test -p spider_cli --bin scorpion
      - name: Cargo test default shipping binary RUN and SHOW fixtures
        run: cargo test -p spider_cli --test research_cli

  # Separately classified: the same 13 live-network tests skipped above,
  # unfiltered, gated behind `RUN_LIVE_TESTS` like the `chrome` job's
  # comparable test — real coverage is preserved, it is simply not part of
  # the required/deterministic closure path. Not treated as
  # `CI_ENFORCED` configuration proof for any capability's closure ledger
  # unless that capability specifically documents a controlled (non-live)
  # test endpoint.
  spider_core_live_network:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_TESTS: ${{ secrets.RUN_LIVE_TESTS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-spidercore-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo test spider lib live network (website crawl/scrape/blacklist/subdomains/tld/subscription/budget/glob/pause_resume/proxy)
        if: env.RUN_LIVE_TESTS == '1' || env.RUN_LIVE_TESTS == 'true' || env.RUN_LIVE_TESTS == 'TRUE'
        run: |
          set -euo pipefail
          cargo test -p spider --lib website::crawl -- --exact --nocapture
          cargo test -p spider --lib website::scrape -- --exact --nocapture
          cargo test -p spider --lib website::crawl_invalid -- --exact --nocapture
          cargo test -p spider --lib website::not_crawl_blacklist -- --exact --nocapture
          cargo test -p spider --lib website::not_crawl_blacklist_regex -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_subdomains -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_glob -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_tld -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_subscription -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_proxy -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_budget -- --exact --nocapture
          cargo test -p spider --lib website::test_crawl_pause_resume -- --exact --nocapture
          cargo test -p spider --lib --features spider_cloud website::test_crawl_shutdown -- --exact --nocapture
      - name: Live-test status when disabled
        if: env.RUN_LIVE_TESTS != '1' && env.RUN_LIVE_TESTS != 'true' && env.RUN_LIVE_TESTS != 'TRUE'
        run: echo "LIVE TESTS = NOT RUN"

  io_uring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-uring-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo check spider with io_uring
        run: cargo check -p spider --features io_uring
      - name: Cargo test spider uring_fs
        run: cargo test -p spider --features io_uring uring_fs
      - name: Cargo test spider (no io_uring fallback)
        run: cargo test -p spider --no-default-features --features basic uring_fs
