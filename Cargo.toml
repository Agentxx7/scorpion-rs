[workspace]
members = [
    "spider",
    "spider_worker",
    "spider_cli",
    "spider_utils",
    "spider_agent",
    "spider_agent_types",
    "spider_agent_html",
    "spider_mcp",
    "spider_transport",
    "spider_search",
    # internal
    "examples",
    "benches"]
exclude = ["vendor/chromey", "vendor/candle-transformers-qwen3vl-fix"]
resolver = "2"

[patch.crates-io]
# Minimal upstream-compatible OOPIF attached-session API.  This remains a
# transport-wrapper patch; Scorpion browser/CAPTCHA policy does not live here.
chromey = { path = "vendor/chromey" }

# SCORPION_LOCAL_CROSS_MODEL_VISION_CAPTCHA_PROVIDER_QUALIFICATION_001:
# candle-transformers 0.11.0's PaliGemma/Gemma-1 implementation applied a
# spurious image-embedding L2 normalization and an incorrect text-embedding
# scale on PaliGemma's multimodal prefill. Root-caused against a pinned
# transformers/PyTorch reference oracle; see
# vendor/candle-transformers-qwen3vl-fix/README.md. (This fork previously
# also carried a Qwen3-VL correctness patch; that patch and the local
# Qwen3-VL CAPTCHA provider it supported were both removed —
# SCORPION_QWEN3_VL_TOTAL_REJECTION_AND_REMOVAL_001 — leaving the fork's
# directory name the only remaining trace, kept unchanged because renaming
# it would touch ~200 unrelated unmodified upstream files for no functional
# benefit.)
candle-transformers = { path = "vendor/candle-transformers-qwen3vl-fix" }

# Unify the external `spider_transformations` crate onto this workspace's
# `spider` instead of pulling a second copy from crates.io. This removes a
# duplicate `spider` compile and keeps the whole tree on one (patched, audited)
# quick-xml. Patch sections are local-only and ignored on publish.
spider = { path = "spider" }
