# Registry of every known live-network test in the `spider` crate's test
# suite (SCORPION_CANONICAL_CLOSURE_AND_PRODUCTION_REALITY_HARNESS_001,
# HIGH 3). spider/tests/closure_harness.rs independently re-derives this
# same set via static analysis (`detect_live_network_tests`) and fails
# if the two disagree in either direction — a newly-added, unregistered
# live test, or a registered entry that static analysis no longer
# detects, both fail loudly rather than being silently accepted.
#
# Every entry here must also have a matching `--skip <test_name>` (or an
# --exact filter that excludes it) in every required, non-gated
# `cargo test -p spider --lib` step in .github/workflows/rust.yml —
# checked by `required_ci_excludes_every_registered_live_test`.
#
# `website::test_crawl_proxy` was found here, not by manual audit — an
# earlier manual pass excluded it because a SOCKS5 proxy address
# (`127.0.0.1:1080`) appears in its body, but that address only
# configures the *proxy*, not the crawl target, which is still the real
# `https://choosealicense.com`. The static detector below does not treat
# "127.0.0.1 appears anywhere" as sufficient for "local" (only a real
# `TcpListener::bind` does), which is exactly what caught this.

[[tests]]
path = "spider/src/website.rs"
test_name = "website::crawl"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::scrape"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::crawl_invalid"
hosts = ["w.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::not_crawl_blacklist"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::not_crawl_blacklist_regex"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_subdomains"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_glob"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_tld"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_subscription"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_proxy"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_budget"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_pause_resume"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_crawl_shutdown"
hosts = ["spider.cloud"]

# SCORPION_CANONICAL_CI_DETERMINISTIC_NETWORK_LOCKDOWN_EXECUTION_001: the
# three entries below were found for real, not by manual audit — the
# first genuinely successful namespace-isolated remote execution of the
# deterministic spider_core test phase (this exact CI job had never
# completed under real network denial before this run) failed exactly
# these two tests (753 passed, 2 failed); the third
# (test_host_resolves_locally_cached_second_call_hits_cache) is included
# alongside its sibling for the same real reason even though it happened
# to still pass — its own passing result is coincidental to how
# host_resolves_locally_cached currently classifies an OS-level
# "network unreachable" error (as NxDomain, the same state a real
# negative DNS response produces), not a structural guarantee; it is
# exactly as network-dependent as the test next to it. Neither test uses
# .crawl()/.scrape()/.crawl_smart() — the static detector's own marker
# list and #[tokio::test] attribute recognition both had to be extended
# to see them (see live_network_hosts_in's doc comment in
# closure_harness.rs).
[[tests]]
path = "spider/src/website.rs"
test_name = "website::test_respect_robots_txt"
hosts = ["stackoverflow.com", "www.mongodb.com"]

[[tests]]
path = "spider/src/page.rs"
test_name = "page::test_host_resolves_locally_cached_does_not_cache_timed_out"
hosts = ["<dynamic-or-unresolved-host>"]

[[tests]]
path = "spider/src/page.rs"
test_name = "page::test_host_resolves_locally_cached_second_call_hits_cache"
hosts = ["<dynamic-or-unresolved-host>"]
