# Registry of every known live-network test in the `spider` crate's test
# suite (SCORPION_CANONICAL_CLOSURE_AND_PRODUCTION_REALITY_HARNESS_001,
# HIGH 3). spider/tests/closure_harness.rs independently re-derives this
# same set via static analysis (`detect_live_network_tests`) and fails
# if the two disagree in either direction — a newly-added, unregistered
# live test, or a registered entry that static analysis no longer
# detects, both fail loudly rather than being silently accepted.
#
# Every entry here must also have a matching `--skip <test_name>` (or an
# --exact filter that excludes it) in every required, non-gated
# `cargo test -p spider --lib` step in .github/workflows/rust.yml —
# checked by `required_ci_excludes_every_registered_live_test`.
#
# `website::test_crawl_proxy` was found here, not by manual audit — an
# earlier manual pass excluded it because a SOCKS5 proxy address
# (`127.0.0.1:1080`) appears in its body, but that address only
# configures the *proxy*, not the crawl target, which is still the real
# `https://choosealicense.com`. The static detector below does not treat
# "127.0.0.1 appears anywhere" as sufficient for "local" (only a real
# `TcpListener::bind` does), which is exactly what caught this.

[[tests]]
path = "spider/src/website.rs"
test_name = "website::crawl"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::scrape"
hosts = ["choosealicense.com"]

[[tests]]
path = "spider/src/website.rs"
test_name = "website::crawl_invalid"
hosts = ["w.com"]

