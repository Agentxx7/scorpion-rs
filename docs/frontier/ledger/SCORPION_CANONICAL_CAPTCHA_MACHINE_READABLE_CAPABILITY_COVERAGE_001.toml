[stages.WIRED]
# `Page::new_streaming`/`Page::new_base` are called via qualified
# associated-call syntax (`Page::new_streaming(...)`, `Self::new_base(...)`)
# at their real call sites, not `.method()` syntax, so this chain never
# depends on the receiver-variable-name heuristic `ast_function_calls`
# applies to true method calls. `fetch_page_html`'s real definition is one
# of two mutually exclusive `#[cfg(all(feature = "fs"|"not(fs)", feature =
# "chrome"))]` overloads; `fs` is declared in additional_cfg_features so
# the harness resolves the `fs`-active overload (the one genuinely present
# in this workspace's own default feature set, which includes `tokio/fs`
# transitively) rather than failing on cfg ambiguity.
additional_cfg_features = ["fs"]
callers = [
    "spider/src/website.rs:Website::crawl -> spider/src/website.rs:crawl_concurrent -> spider/src/website.rs:crawl_establish -> spider/src/page.rs:Page::new_streaming -> spider/src/page.rs:Page::new_base -> spider/src/utils/mod.rs:fetch_page_html -> spider/src/utils/mod.rs:fetch_page_html_chrome_base -> spider/src/utils/mod.rs:fetch_page_html_chrome_base_inner -> spider/src/features/browser_challenge_detection.rs:detect_browser_challenge",
]

