[stages.WIRED]
# `Page::new_streaming`/`Page::new_base` are called via qualified
# associated-call syntax (`Page::new_streaming(...)`, `Self::new_base(...)`)
# at their real call sites, not `.method()` syntax, so this chain never
# depends on the receiver-variable-name heuristic `ast_function_calls`
# applies to true method calls. `fetch_page_html`'s real definition is one
# of two mutually exclusive `#[cfg(all(feature = "fs"|"not(fs)", feature =
# "chrome"))]` overloads; `fs` is declared in additional_cfg_features so
# the harness resolves the `fs`-active overload (the one genuinely present
# in this workspace's own default feature set, which includes `tokio/fs`
# transitively) rather than failing on cfg ambiguity.
additional_cfg_features = ["fs"]
callers = [
    "spider/src/website.rs:Website::crawl -> spider/src/website.rs:crawl_concurrent -> spider/src/website.rs:crawl_establish -> spider/src/page.rs:Page::new_streaming -> spider/src/page.rs:Page::new_base -> spider/src/utils/mod.rs:fetch_page_html -> spider/src/utils/mod.rs:fetch_page_html_chrome_base -> spider/src/utils/mod.rs:fetch_page_html_chrome_base_inner -> spider/src/features/browser_challenge_detection.rs:detect_browser_challenge",
]

[stages.PRODUCTION_REACHABLE]
reachability_kind = "binary_default"
shipping_artifacts = ["spider_cli", "spider_mcp"]
feature_requirements = ["chrome"]
entry_point_symbols = ["Website::crawl"]
siblings_enumerated = true
siblings = [
    "spider_worker (default features = [] — chrome not enabled by default; its request handlers also use Page::new_page_streaming directly rather than Website::crawl, so it is not a sibling reachability path for this capability even when chrome is enabled)",
]
siblings_note = "spider_cli and spider_mcp are the only known shipping artifacts whose default feature set both enables chrome and whose own source calls Website::crawl directly. spider_worker does not qualify under either its default (no chrome) or an optional chrome build (different call path, Page::new_page_streaming, not Website::crawl)."
verdict = "MET"
verdict_evidence = "spider_cli/Cargo.toml default = [..., \"chrome\", ...] (line 62) and spider_cli/src/main.rs:crawl_with_mode calls website.crawl().await under #[cfg(feature = \"chrome\")] when headless is requested — the shipping binary's own default build. spider_mcp/Cargo.toml default = [\"chrome\", ...] (line 54) and spider_mcp/src/tools/mod.rs:spawn_crawl_task calls website.crawl().await under the same #[cfg(feature = \"chrome\")] guard when use_headless is true, via a real `use spider::website::Website;` import (spider_mcp/src/tools/mod.rs:19) binding to the canonical external-artifact spelling."
