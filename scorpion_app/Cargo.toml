[package]
name = "scorpion_app"
version = "2.53.4"
authors = ["j-mendez <jeff@spider.cloud>"]
edition = "2021"
description = "Small server-side application boundary over Scorpion's canonical capabilities."
license = "MIT"

[dependencies]
# JWT (id_token) is compact-base64url, three dot-separated segments. Used
# only for base64url decoding of the header/payload segments in
# scorpion_app/src/iam.rs's bounded, decode-only JWT inspection — the same
# pinned version already used identically by spider/spider_agent/
# spider_mcp/spider_cli (spider_cli/src/oauth.rs's own loopback OAuth
# callback). No JWT/JWS/verification crate: this is base64 decoding only.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spider = { path = "../spider", default-features = false, features = ["search_searxng", "agent_acquisition", "agent_search_searxng", "agent_openai", "disk", "serde", "evidence"] }
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "sync"] }

[[bin]]
name = "scorpion-api"
path = "src/main.rs"

# SCORPION_WINDOWS_INSTALLABLE_APPLICATION_001: the thin Windows startup
# orchestrator packaged alongside scorpion-api.exe by scorpion_app/wix/main.wxs. Zero
# new dependencies (see scorpion_launcher.rs's own module doc) — it
# builds on every platform this workspace already targets, but its
# meaningful behavior (hidden console window, %LOCALAPPDATA% resolution,
# CREATE_NO_WINDOW child spawn) is Windows-only, matching this
# frontier's Windows-first scope.
[[bin]]
name = "scorpion-launcher"
path = "src/bin/scorpion_launcher.rs"
