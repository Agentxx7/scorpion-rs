[package]
name = "spider_cli"
version = "2.53.4"
authors = ["j-mendez <jeff@spider.cloud>"]
description = "Scorpion command-line interface for crawling, evidence-first acquisition, and durable web research, built on Spider."
repository = "https://github.com/Agentxx7/scorpion-rs"
readme = "README.md"
keywords = ["crawler", "spider", "spider_cli"]
categories = ["web-programming", "command-line-utilities"]
license = "MIT"
documentation = "https://docs.rs/spider"
homepage = "https://spider.cloud/crates"
include = ["src/*", "LICENSE", "README.md"]
edition = "2021"
resolver = "2"

[badges]
maintenance = { status = "as-is" }

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "net"] }
# `spider login` — browser OAuth 2.1 + PKCE sign-in.
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"

[build-dependencies]
quote = "1"
failure_derive = "0.1.8"

[dependencies.spider]
version = "2"
path = "../spider"
default-features = false
features = ["tokio_io_std", "sync", "serde", "cookies"]

[dependencies.spider_transformations]
version = "2"

# Only pulled in when the `mcp` feature is selected — `scorpion mcp` reuses
# the exact same canonical server implementation `spider-mcp` runs, via
# spider_mcp's own library seam (`spider_mcp::serve_stdio`). No tool
# registration or server logic is duplicated here.
[dependencies.spider_mcp]
version = "2"
path = "../spider_mcp"
optional = true

[[bin]]
name = "scorpion"
path = "src/main.rs"
doc = false

[features]
default = ["status_code", "chrome", "warc", "spider_cloud", "fetch", "feed", "sitemap", "news_sitemap", "robots_sitemap", "search_searxng", "research", "audit", "mcp", "transport_tor"]
# Evidence-first single-resource acquisition (`spider fetch <url>`).
fetch = ["spider/evidence"]
# Canonical deterministic page audit (`scorpion audit <url>`) — the same
# audit_page() engine spider_mcp's spider_audit_page tool and
# scorpion_app's POST /api/audit route call. Requires disk (durable
# evidence/finding persistence) in addition to evidence.
audit = ["spider/evidence", "spider/disk"]
feed = ["spider/feed", "spider/evidence"]
sitemap = ["spider/sitemap", "spider/evidence"]
news_sitemap = ["spider/news_sitemap", "spider/evidence"]
robots_sitemap = ["spider/robots_sitemap", "spider/evidence"]
search_searxng = ["spider/search_searxng"]
# Shipping durable canonical research. Custom no-default-feature builds remain
# unaffected unless they explicitly select this feature.
research = [
    "spider/search",
    "spider/agent_acquisition",
    "spider/agent_openai",
    "spider/agent_search_searxng",
    "spider/disk",
]
# `scorpion mcp` — launches the canonical Spider MCP server in-process,
# with spider_mcp's own default tool surface (chrome, search_searxng,
# feed/sitemap/news_sitemap/robots_sitemap, spider_cloud) intact, so it is
# genuinely the same server `spider-mcp` runs, not a reduced one.
mcp = ["dep:spider_mcp"]
# Forwards to `spider/transport_tor` — the audited fail-closed Tor SOCKS5h
# transport (`--transport tor --tor-proxy socks5h://HOST:PORT`). Also
# forwards into `spider_mcp` (only takes effect when `mcp` is active too,
# via the weak `spider_mcp?/transport_tor` dependency feature) so
# `scorpion mcp` advertises the identical Tor capability as the standalone
# `spider-mcp` binary. Part of `default` so the normal released `scorpion`
# binary actually supports the Tor controls it exposes; a
# `--no-default-features` custom build that omits this still exposes the
# same `--transport`/`--tor-proxy` flags (parsing never depends on this
# feature) but fails closed at runtime with an explicit "Tor not compiled"
# error instead of silently using Default transport.
transport_tor = ["spider/transport_tor", "spider_mcp?/transport_tor"]
spider_cloud = ["spider/spider_cloud"]
warc = ["spider/warc"]
jemalloc = ["tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
regex = ["spider/regex"]
chrome_intercept = ["spider/chrome_intercept"]
chrome = ["spider/chrome"]
smart = ["spider/smart"]
headers = ["spider/headers"]
time = ["spider/time"]
status_code = []
remote_addr = ["spider/remote_addr"]
# Canonical Hugging Face artifact-discovery provider
# (`scorpion hugging-face-artifacts <repository_id>`) — read-only repository
# file listing with provider-declared identities, never a download. Not
# part of `default`: this is the first public-interface exposure of this
# capability family (SCORPION_CANONICAL_HUGGING_FACE_ARTIFACT_DISCOVERY_
# CLI_SURFACE_001) and is deliberately opt-in pending a separate decision
# on wider rollout. Forwards to `spider/source_hugging_face` (module-level
# gate on `hugging_face_source_provider`, itself just `serde`) — the only
# genuine compile prerequisite this capability has.
hugging_face_artifacts = ["spider/source_hugging_face"]
# Canonical local PaliGemma CAPTCHA provider (SigLIP + Gemma). Not part of
# `default`: an 11+ GB pinned model checkpoint is not something an ordinary
# `scorpion` build should pull in silently. Forwards only the library
# feature — selecting `Configuration::captcha_provider = PALIGEMMA_LOCAL`
# still requires a verified local installation at
# `SCORPION_PALIGEMMA_PINNED_ARTIFACTS`; it is never downloaded implicitly.
local_paligemma = ["spider/local_paligemma"]
# Accelerated (CUDA/F16) execution for the same pinned local_paligemma
# runtime. Requires a real CUDA toolchain to build; there is no CPU
# fallback baked into this feature.
local_paligemma_cuda = ["local_paligemma", "spider/local_paligemma_cuda"]

[target.'cfg(all(not(windows), not(target_os = "android"), not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
