[package]
name = "spider_mcp"
version = "2.53.4"
authors = ["j-mendez <jeff@spider.cloud>"]
description = "MCP (Model Context Protocol) server exposing Spider web crawler capabilities as tools."
repository = "https://github.com/spider-rs/spider"
readme = "README.md"
keywords = ["crawler", "spider", "mcp", "scraper"]
categories = ["web-programming", "command-line-utilities"]
license = "MIT"
documentation = "https://docs.rs/spider_mcp"
homepage = "https://spider.cloud/crates"
include = ["src/*", "LICENSE", "README.md"]
edition = "2021"
resolver = "2"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-async-rw"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
infer = { version = "0.22", default-features = false, features = ["alloc"] }
pdf-extract = "0.9"

[dependencies.spider]
version = "2"
path = "../spider"
features = ["tokio_io_std", "sync", "serde", "cookies", "evidence"]

[dependencies.spider_transformations]
version = "2"

[[bin]]
name = "spider-mcp"
path = "src/main.rs"
doc = false

[features]
default = ["chrome", "chrome_screenshot", "spider_cloud", "search_searxng", "feed", "sitemap", "news_sitemap", "robots_sitemap"]
feed = ["spider/feed"]
sitemap = ["spider/sitemap"]
news_sitemap = ["spider/news_sitemap"]
robots_sitemap = ["spider/robots_sitemap"]
chrome = ["spider/chrome"]
# Enables spider_transformations' own `screenshot` feature, which is what
# turns `ReturnFormat::Screenshot` from a hardcoded empty string into a real
# base64 encode of the captured screenshot bytes. Previously this flag was
# declared but unused — no code in this crate referenced it.
chrome_screenshot = ["chrome", "spider_transformations/screenshot"]
smart = ["spider/smart"]
spider_cloud = ["spider/spider_cloud"]
search = []
search_serper = ["search", "spider/search_serper"]
search_brave = ["search", "spider/search_brave"]
# Powers the spider_search MCP tool's provider="searxng" — a self-hosted
# metasearch provider requiring no API key and no spider.cloud dependency.
search_searxng = ["search", "spider/search_searxng"]
full = ["chrome_screenshot", "smart", "spider_cloud", "search_serper", "search_searxng"]
