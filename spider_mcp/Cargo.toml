[package]
name = "spider_mcp"
version = "2.53.4"
authors = ["j-mendez <jeff@spider.cloud>"]
description = "MCP (Model Context Protocol) server exposing Spider web crawler capabilities as tools."
repository = "https://github.com/spider-rs/spider"
readme = "README.md"
keywords = ["crawler", "spider", "mcp", "scraper"]
categories = ["web-programming", "command-line-utilities"]
license = "MIT"
documentation = "https://docs.rs/spider_mcp"
homepage = "https://spider.cloud/crates"
include = ["src/*", "LICENSE", "README.md"]
edition = "2021"
resolver = "2"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-async-rw"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
infer = { version = "0.22", default-features = false, features = ["alloc"] }
pdf-extract = "0.12"

[dependencies.spider]
version = "2"
path = "../spider"
features = ["tokio_io_std", "sync", "serde", "cookies", "evidence"]

[dependencies.spider_transformations]
version = "2"

[dev-dependencies]
# Real base64 decoding for tests that must prove a screenshot response is
# genuine PNG bytes (magic-byte check), not merely a non-empty string.
base64 = "0.22"

[lib]
name = "spider_mcp"
path = "src/lib.rs"

[[bin]]
name = "spider-mcp"
path = "src/main.rs"
doc = false

[features]
default = ["chrome", "chrome_screenshot", "spider_cloud", "search_searxng", "feed", "sitemap", "news_sitemap", "robots_sitemap", "transport_tor"]
# Forwards to `spider/transport_tor` — the audited fail-closed Tor SOCKS5h
# transport, exposed as an optional `transport` field on the applicable
# tool schemas. Part of `default` so the released `spider-mcp` binary (and
# `scorpion mcp`, which runs this exact server — see `lib.rs`) actually
# supports the Tor capability it advertises. A `--no-default-features`
# custom build still exposes the schema field (schema generation never
# depends on this feature) but fails closed at runtime with an explicit
# "Tor not compiled" error instead of silently using Default transport.
transport_tor = ["spider/transport_tor"]
feed = ["spider/feed"]
sitemap = ["spider/sitemap"]
news_sitemap = ["spider/news_sitemap"]
robots_sitemap = ["spider/robots_sitemap"]
chrome = ["spider/chrome"]
# Enables spider_transformations' own `screenshot` feature, which is what
# turns `ReturnFormat::Screenshot` from a hardcoded empty string into a real
# base64 encode of the captured screenshot bytes. Previously this flag was
# declared but unused — no code in this crate referenced it.
chrome_screenshot = ["chrome", "spider_transformations/screenshot"]
smart = ["spider/smart"]
spider_cloud = ["spider/spider_cloud"]
search = []
search_serper = ["search", "spider/search_serper"]
search_brave = ["search", "spider/search_brave"]
# Powers the spider_search MCP tool's provider="searxng" — a self-hosted
# metasearch provider requiring no API key and no spider.cloud dependency.
search_searxng = ["search", "spider/search_searxng"]
full = ["chrome_screenshot", "smart", "spider_cloud", "search_serper", "search_searxng"]
# Canonical local PaliGemma CAPTCHA provider (SigLIP + Gemma). Not part of
# `default`/`full`: an 11+ GB pinned model checkpoint is not something an
# ordinary `spider-mcp` build should pull in silently. Forwards only the
# library feature — selecting `Configuration::captcha_provider =
# PALIGEMMA_LOCAL` still requires a verified local installation at
# `SCORPION_PALIGEMMA_PINNED_ARTIFACTS`; it is never downloaded implicitly.
local_paligemma = ["spider/local_paligemma"]
# Accelerated (CUDA/F16) execution for the same pinned local_paligemma
# runtime. Requires a real CUDA toolchain to build; there is no CPU
# fallback baked into this feature.
local_paligemma_cuda = ["local_paligemma", "spider/local_paligemma_cuda"]
